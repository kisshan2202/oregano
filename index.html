<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a352c">
<title>Oregano's Bakehouse &amp; Cafe – Wollert</title>
<meta name="description" content="Oregano's Bakehouse & Cafe in Wollert: fresh zaatar manoush, pizzas, pockets, sweets and coffee.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="banner">
  <h1 class="logo"><img src="images/oreganos-logo-transparent.svg" width="651" height="307" alt="Oregano’s Bakehouse &amp; Cafe"></h1>
  <div class="sub">Wollert</div>
</header>

<section class="showcase" aria-label="Menu highlights">
  <div class="marquee"><div class="track" id="track"></div></div>
</section>

<nav id="nav"></nav>
<main id="menu"><p class="loading">Loading menu…</p></main>

<section id="about" class="about"></section>

<dialog id="about-dlg"><form method="dialog" id="about-form"></form></dialog>

<footer>
  <span id="updated"></span> · Prices in AUD and subject to change ·
  <a href="#admin" id="admin-link">Admin</a>
</footer>

<div id="adminbar" hidden>
  <strong>Admin mode</strong>
  <span id="draftstate"></span>
  <span class="spacer"></span>
  <button id="btn-publish">Publish</button>
  <button id="btn-discard" class="ghost">Discard changes</button>
  <button id="btn-logout" class="ghost">Exit</button>
</div>

<dialog id="pw">
  <form method="dialog" id="pw-form">
    <h3>Admin password</h3>
    <input id="pw-input" type="password" placeholder="Password" autocomplete="current-password" required>
    <p class="err" id="pw-err"></p>
    <div class="actions"><button type="button" class="ghost" id="pw-cancel">Cancel</button><button id="pw-go">Unlock</button></div>
  </form>
</dialog>

<dialog id="login">
  <form method="dialog" id="login-form">
    <h3>Admin sign-in</h3>
    <p>Paste a GitHub access token with <em>Contents: read and write</em> access to this repository. It is stored only in this browser.</p>
    <input id="token" type="password" placeholder="github_pat_…" autocomplete="off" required>
    <p class="err" id="login-err"></p>
    <div class="actions"><button type="button" class="ghost" id="login-cancel">Cancel</button><button>Sign in</button></div>
  </form>
</dialog>

<dialog id="editor">
  <form method="dialog" id="edit-form">
    <h3 id="edit-title">Edit item</h3>
    <label>Name<input id="f-name" required maxlength="80"></label>
    <label>Price (AUD, leave blank for none)<input id="f-price" inputmode="decimal" maxlength="12"></label>
    <label>Description<textarea id="f-desc" rows="3" maxlength="300"></textarea></label>
    <label>Image<input id="f-image" type="file" accept="image/*"></label>
    <div class="preview"><div id="f-preview"></div><button type="button" class="ghost" id="f-clear">Remove image</button></div>
    <div class="actions"><button type="button" class="ghost danger" id="f-delete">Delete</button><span class="spacer"></span><button type="button" class="ghost" id="f-cancel">Cancel</button><button>Save</button></div>
  </form>
</dialog>

<dialog id="detail" aria-label="Item details">
  <button class="d-close" id="d-close" aria-label="Close">✕</button>
  <div class="d-imgwrap">
    <div class="d-img" id="d-img"></div>
    <button class="d-nav prev" id="d-prev" aria-label="Previous item">‹</button>
    <button class="d-nav next" id="d-next" aria-label="Next item">›</button>
  </div>
  <div class="d-body">
    <div class="d-sec" id="d-sec"></div>
    <h3 id="d-name"></h3>
    <div class="d-price" id="d-price"></div>
    <p id="d-desc"></p>
    <div class="d-count" id="d-count"></div>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
